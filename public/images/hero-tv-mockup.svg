<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" fill="none">
  <defs>
    <linearGradient id="screen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="8"/></filter>
  </defs>
  <rect width="1200" height="800" fill="#09090b"/>
  <!-- TV frame -->
  <rect x="150" y="80" width="900" height="520" rx="24" fill="#27272a" stroke="url(#glow)" stroke-width="2"/>
  <rect x="180" y="110" width="840" height="460" rx="12" fill="url(#screen)"/>
  <!-- Screen content -->
  <rect x="200" y="130" width="300" height="180" rx="8" fill="#3b82f6" opacity="0.2"/>
  <rect x="520" y="130" width="480" height="80" rx="6" fill="#a855f7" opacity="0.15"/>
  <rect x="520" y="230" width="480" height="80" rx="6" fill="#3b82f6" opacity="0.1"/>
  <rect x="520" y="330" width="480" height="80" rx="6" fill="#a855f7" opacity="0.1"/>
  <text x="350" y="240" text-anchor="middle" fill="#3b82f6" font-family="system-ui,sans-serif" font-size="28" font-weight="700">4K UHD</text>
  <text x="350" y="275" text-anchor="middle" fill="#71717a" font-family="system-ui,sans-serif" font-size="16">ZerTech IPTV</text>
  <!-- Stand -->
  <rect x="520" y="600" width="160" height="20" rx="4" fill="#3f3f46"/>
  <rect x="480" y="620" width="240" height="12" rx="6" fill="#52525b"/>
  <!-- Glow effects -->
  <ellipse cx="600" cy="400" rx="400" ry="200" fill="#3b82f6" opacity="0.05" filter="url(#blur)"/>
  <ellipse cx="600" cy="400" rx="200" ry="100" fill="#a855f7" opacity="0.08" filter="url(#blur)"/>
</svg>
