<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" fill="none">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b"/>
      <stop offset="50%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="crystal1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient id="crystal2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.3"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="20" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="1200" height="800" fill="url(#bg)"/>
  <circle cx="300" cy="250" r="180" fill="url(#crystal1)" filter="url(#glow)" opacity="0.5"/>
  <circle cx="900" cy="500" r="220" fill="url(#crystal2)" filter="url(#glow)" opacity="0.4"/>
  <polygon points="600,120 720,280 600,440 480,280" fill="url(#crystal1)" opacity="0.7"/>
  <polygon points="850,180 950,320 850,460 750,320" fill="url(#crystal2)" opacity="0.5"/>
  <polygon points="200,450 320,550 200,650 80,550" fill="url(#crystal1)" opacity="0.4"/>
  <line x1="480" y1="280" x2="750" y2="320" stroke="#3b82f6" stroke-width="1" opacity="0.3"/>
  <line x1="720" y1="280" x2="850" y2="320" stroke="#a855f7" stroke-width="1" opacity="0.3"/>
  <line x1="320" y1="550" x2="480" y2="280" stroke="#60a5fa" stroke-width="1" opacity="0.2"/>
  <circle cx="600" cy="280" r="4" fill="#fff" opacity="0.8"/>
  <circle cx="850" cy="320" r="4" fill="#fff" opacity="0.6"/>
  <circle cx="200" cy="550" r="3" fill="#fff" opacity="0.5"/>
</svg>
